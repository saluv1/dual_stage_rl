# Obstacle-only demo on the stock Gazebo x500 (make px4_sitl gz_x500): the go-to-goal nominal through the online
# backup filter (PS2-RL docker_batch/README_cyl_online.md), east past virtual cylinders to a goal, 1.5 m up.
#
# Courses (x east / y north of the take-off point; PS2-RL docker_batch/configs/cyl_online_candidates.json):
#   O3  one cylinder r 0.1 at (1.3, -0.1), goal (3.3, 0)
#   S1  slalom: r 0.1 at (1.1, -0.1) and (3.1, 1.6), goal (4.3, 0)
# Nothing is placed in Gazebo: the cylinders exist only for the filter and the contact check.
#
# Every field of CylFlightConfig (PS2-RL/ps2rl/deploy/cyl_online_flight.py, which extends the landing FlightConfig)
# is also a parameter of this node and can be added below. Relative paths are taken from ps2rl_path.
/ps2rl_cyl_online:
  ros__parameters:
    ps2rl_path: "/home/dev/ws_shared/PS2-RL"

    # ---- controller -------------------------------------------------------------------------
    backup: "checkpoints/cyl_online/td3_w128_seed0"   # the recommended backup (width 128)
    course: "S1"                          # O3 / S1 (any O1..O4, S1..S4), or "custom" with obstacles + goal
    obstacles: ""                         # "x,y,r;x,y,r" [m], replaces the course's cylinders
    goal: ""                              # "x,y" [m], replaces the course's goal
    nominal: "planner"                    # planner: heading search, 1 m from the surfaces; straight: no search
    search_margin: 1.0
    cruise: 1.0                           # [m/s]
    blends: 2                             # the recommended setting: lam in (1, 0), horizon 1 s, a decision every step
    horizon: 1.0
    period: 1                             # commands per filter decision
    backend: "auto"                       # numba if installed for python3, else numpy
    sensing_range: 6.0
    flight_height: 1.5                    # hand-over point and course height above the take-off point [m]
    observer_gain: 2.0                    # disturbance observer (absorbs the thrust-map error); 0 = off

    # ---- compute (2026-11-20, for the Raspberry Pi; the first SITL flights used 0.02 / false / multi) -------------
    control_period: 0.04                  # one command per 40 ms (25 Hz), held by PX4; the filter's rollouts hold it
                                          # as long. policy_rate follows it. 0.02 = 50 Hz
    process: true                         # the controller in its own process: no GIL shared with the executor
    worker_cpu: -1                        # process: pin it to a CPU core (e.g. 3 on the Pi); -1 = no pinning
    executor: "single"                    # ROS executor threads: single / multi (env PS2RL_EXECUTOR takes precedence)
    setpoint_rate: 50.0                   # the offboard stream re-sends the held command at this rate

    # ---- thrust map: a = k2 T^2 + k1 T + k0, measured on the stock x500 (ws_shared/thrust_fit_x500.yaml, as slow_track_x500.yaml)
    # The command box is 0.5-1.5 g (4.9-14.7 m/s^2), inside the x500's 16.6 m/s^2.
    thrust_model: "quadratic"
    thrust_k2: 14.574044
    thrust_k1: 0.807446
    thrust_k0: 1.489934
    hover_thrust: 0.728                   # used by the "linear" model only
    thrust_min: 0.02
    thrust_max: 1.0

    # ---- flight -----------------------------------------------------------------------------
    pad_offset: "0,0,0"                   # the task frame's origin = the take-off point
    settle_time: 8.0                      # hold at the hand-over point before handing over [s]
    policy_timeout: 30.0                  # longest controller phase [s] (simulations: 4.7 s O3, 6.3 s S1 with the planner)
    arrive_speed: 0.25                    # end: inside the 0.5 m goal circle and slower than this [m/s]
    end_hold_time: 3.0                    # hover where the controller phase ended, then land [s]
    contact_abort: true                   # abort -> hover where it is -> land: contact with a virtual cylinder
    tilt_abort_deg: 35.0                  #   ... tilt [deg]
    max_speed: 2.0                        #   ... speed [m/s]
    min_height: 0.3                       #   ... height above the take-off point [m]
    recover_time: 3.0                     # hover this long after an abort, then land [s]

    odom_timeout: 0.30                    # stale odometry during the controller phase -> abort
    log_root: "/home/dev/ws_shared/experiments/cyl_online"   # each flight gets <log_root>/<time>-<label>/
    label: "cyl_online"
    exit_when_done: true
